<section class="slide tempo-slide" data-quem="felipe" data-nome="Beleza em transformação">
  <div class="tempo-topo">
    <h2 class="titulo menor">Beleza em <mark>transformação</mark></h2>
    <p class="lead a sobe" style="--d: 450">O que é bonito muda com a época e com o lugar. A beleza nunca foi uma só.</p>
  </div>

  <div class="tempo">
    <i class="tempo-linha a linha" style="--d: 500"></i>
    <figure class="era a sobe" style="--d: 700">
      <div class="era-foto"><img src="@img/estatua" alt="Escultura clássica grega" /></div>
      <i class="era-ponto"></i>
      <figcaption><span>Grécia Antiga</span><b>Proporção</b><em>harmonia das formas</em></figcaption>
    </figure>
    <figure class="era a sobe" style="--d: 900">
      <div class="era-foto"><img src="@img/renascimento" alt="La Bella, pintura de Ticiano, 1536" /></div>
      <i class="era-ponto"></i>
      <figcaption><span>Renascimento</span><b>Corpo cheio</b><em>arredondado era bonito</em></figcaption>
    </figure>
    <figure class="era a sobe" style="--d: 1100">
      <div class="era-foto"><img src="@img/anos60" alt="Modelo Twiggy nos anos 1960" /></div>
      <i class="era-ponto"></i>
      <figcaption><span>Século XX</span><b>Magreza</b><em>cinema, revista e moda</em></figcaption>
    </figure>
    <figure class="era era-hoje a sobe" style="--d: 1300">
      <div class="era-foto"><img src="@img/hoje" alt="Corpo musculoso e definido de academia" /></div>
      <i class="era-ponto"></i>
      <figcaption><span>Hoje</span><b>Magro e definido</b><em>academia e redes sociais</em></figcaption>
    </figure>
  </div>

  <p class="fonte">Eco (2004) · Sant'Anna (2014)</p>
</section>
